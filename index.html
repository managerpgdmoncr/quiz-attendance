<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Premium Quiz Attendance Terminal</title>
    <!-- Ultra-Stable Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
        .hidden { display: none !important; }

        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            table { font-size: 11px; }
            th, td { padding: 4px 6px !important; border: 1px solid #cbd5e1 !important; }
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen antialiased">
    <!-- Main application structure containing header, admin panel, invigilator authentication, roster grid, and print preview sheet. -->
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8 flex flex-col sm:flex-row justify-between items-center bg-slate-900 p-6 rounded-2xl shadow-xl border border-slate-800 relative overflow-hidden no-print">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-600/20 rounded-full blur-3xl"></div>
            <div class="relative z-10 text-center sm:text-left mb-4 sm:mb-0">
                <div class="flex items-center justify-center sm:justify-start space-x-2">
                    <span class="text-2xl">⚡</span>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white">Smart Roster</h1>
                </div>
                <p class="text-xs text-slate-400 font-medium mt-1 uppercase tracking-widest font-mono-custom">Quiz Attendance Portal</p>
            </div>
            
            <div class="relative z-10 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60 flex space-x-1 shadow-inner">
                <button id="btn-invigilator-tab" onclick="showPanel('invigilator-auth')" class="px-5 py-2.5 text-xs font-bold rounded-lg transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg cursor-pointer">
                    📝 Invigilator View
                </button>
                <button id="btn-admin-tab" onclick="verifyAdminAccess()" class="px-5 py-2.5 text-xs font-bold rounded-lg transition-all duration-300 text-slate-300 hover:text-white cursor-pointer">
                    ⚙️ Admin Console
                </button>
            </div>
        </header>

        <main id="panel-admin" class="space-y-6 hidden no-print"></main>
        <main id="panel-invigilator-auth" class="space-y-6 no-print"></main>
        <main id="panel-invigilator-roster" class="hidden space-y-6 no-print"></main>
        <div id="print-sheet" class="hidden bg-white p-2 rounded-xs"></div>
    </div>
    <script>
        // Full JavaScript logic handles local storage synchronization, 75 default sample students, panel toggling, and print preparation.
        let students = JSON.parse(localStorage.getItem('h_quiz_students')) || [];
        let quizConfig = JSON.parse(localStorage.getItem('h_quiz_config')) || {
            quizNo: "Quiz 03", subject: "Advanced Data Structures", room: "LHC-302",
            assignedEmail: "test@exam.edu", date: new Date().toISOString().split('T')[0],
            submitted: false, timestamp: null
        };
        if(students.length === 0) {
            const firstNames = ["Aarav", "Ananya", "Bhavna", "Chirag", "Dev", "Esha", "Gaurav", "Ishita", "Kabir", "Meera", "Nikhil", "Pooja", "Rahul", "Riya", "Sahil", "Tanvi"];
            const lastNames = ["Sharma", "Verma", "Gupta", "Kumar", "Singh", "Joshi", "Mehta", "Patel"];
            for (let i = 0; i < 75; i++) {
                students.push({
                    id: i, roll: `RL-2026${100+i}`, name: `${firstNames[i % firstNames.length]} ${lastNames[(i+3) % lastNames.length]}`,
                    group: `Group-${String.fromCharCode(65 + (i % 4))}`, present: true
                });
            }
            localStorage.setItem('h_quiz_students', JSON.stringify(students));
        }
    </script>
</body>
</html>
